name: Build and Test

on:
  push:
    branches: [ main ]
  # Not filtered by base branch: stacked PRs target a feature branch, not main,
  # and still need the gate.
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
        dotnet-quality: preview
    - name: Setup paket
      run: dotnet tool restore
    - name: Check formatting
      run: dotnet fantomas src test --check
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    # Quill is a plain executable, not a `dotnet test` adapter — the process exit
    # code is the result. `dotnet test` would find no adapter and exit 0 without
    # running anything.
    - name: Test
      run: dotnet run --project test --configuration Release --no-restore

  # decision: executes the shared Scriptorium suite on every Fable target so runtime regressions fail CI
  fable-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        target: [js, python, beam]

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install just
      uses: extractions/setup-just@v3
    - name: Setup Node
      if: matrix.target == 'js'
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Setup Python
      if: matrix.target == 'python'
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Setup uv
      if: matrix.target == 'python'
      uses: astral-sh/setup-uv@v7
    - name: Setup BEAM
      if: matrix.target == 'beam'
      uses: erlef/setup-beam@v1
      with:
        otp-version: '27'
        rebar3-version: '3'
    - name: Restore tools and dependencies
      run: just restore
    - name: Run ${{ matrix.target }} suite
      run: just test-${{ matrix.target }}
