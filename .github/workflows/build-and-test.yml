name: Build and Test

on:
  push:
    branches: [ main ]
  # Not filtered by base branch: stacked PRs target a feature branch, not main,
  # and still need the gate.
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
        dotnet-quality: preview
    - name: Setup paket
      run: dotnet tool restore
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    # Quill is a plain executable, not a `dotnet test` adapter — the process exit
    # code is the result. `dotnet test` would find no adapter and exit 0 without
    # running anything.
    - name: Test
      run: dotnet run --project test --configuration Release --no-restore
